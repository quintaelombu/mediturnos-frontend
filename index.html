<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mediturnos</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f3f3f3; }
        h2 { color: #333; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
        input, select, button {
            padding: 10px; width: 100%; margin-top: 8px; margin-bottom: 10px;
            border-radius: 6px; border: 1px solid #ccc;
        }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #resultado { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Mediturnos</h1>

    <!-- Crear doctor -->
    <div class="card">
        <h2>Crear Doctor</h2>
        <input id="doc_nombre" placeholder="Nombre del médico">
        <input id="doc_email" placeholder="Email del médico">
        <input id="doc_especialidad" placeholder="Especialidad">
        <input id="doc_duracion" placeholder="Duración de turno (minutos)">
        <input id="doc_precio" placeholder="Precio de la consulta">
        <button onclick="crearDoctor()">Crear Doctor</button>
        <div id="doctor_msg"></div>
    </div>

    <!-- Crear turno -->
    <div class="card">
        <h2>Crear Turno</h2>
        <input id="paciente_nombre" placeholder="Nombre del paciente">
        <input id="paciente_email" placeholder="Email del paciente">

        <select id="doctor_id"></select>

        <input id="fecha" type="date">
        <input id="hora" type="time">
        <input id="motivo" placeholder="Motivo de consulta">

        <button onclick="crearTurno()">Crear Turno</button>
        <div id="turno_msg"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>

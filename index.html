<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mediturnos — Frontend</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input { padding: 6px; margin: 5px; }
        button { padding: 6px 12px; }
        #mensaje { color: green; margin-top: 10px; }
        #error { color: red; margin-top: 10px; }
    </style>
</head>
<body>

<h1>Mediturnos — Frontend</h1>

<h2>Crear doctor</h2>
<input id="docNombre" placeholder="Nombre">
<input id="docEsp" placeholder="Especialidad">
<button onclick="crearDoctor()">Crear doctor</button>

<h2>Crear turno</h2>
<input id="turDocId" placeholder="ID Doctor">
<input id="turNombre" placeholder="Nombre Paciente">
<input id="turEmail" placeholder="Email Paciente">
<button onclick="crearTurno()">Crear turno</button>

<p id="mensaje"></p>
<p id="error"></p>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mediturnos</title>
</head>
<body>

<h2>Crear Doctor</h2>
<input id="doc_nombre" placeholder="Nombre"><br>
<input id="doc_esp" placeholder="Especialidad"><br>
<button onclick="crearDoctor()">Crear Doctor</button>

<hr>

<h2>Crear Turno</h2>
<input id="turno_doctor" placeholder="ID Doctor"><br>
<input id="turno_paciente" placeholder="Nombre Paciente"><br>
<input id="turno_fecha" placeholder="Fecha (YYYY-MM-DD)"><br>
<input id="turno_hora" placeholder="Hora (HH:MM)"><br>
<button onclick="crearTurno()">Crear Turno</button>

<hr>

<h2>Doctores</h2>
<button onclick="cargarDoctores()">Ver Doctores</button>
<pre id="doctores"></pre>

<h2>Turnos</h2>
<button onclick="cargarTurnos()">Ver Turnos</button>
<pre id="turnos"></pre>

<script>
const API = "https://mediturnos-backend-production.up.railway.app";

function crearDoctor() {
    fetch(API + "/doctores", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            nombre: document.getElementById("doc_nombre").value,
            especialidad: document.getElementById("doc_esp").value
        })
    }).then(r => r.json()).then(alert);
}

function crearTurno() {
    fetch(API + "/turnos", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            doctor_id: document.getElementById("turno_doctor").value,
            paciente: document.getElementById("turno_paciente").value,
            fecha: document.getElementById("turno_fecha").value,
            hora: document.getElementById("turno_hora").value
        })
    }).then(r => r.json()).then(alert);
}

function cargarDoctores() {
    fetch(API + "/doctores")
        .then(r => r.json())
        .then(data => {
            document.getElementById("doctores").textContent = JSON.stringify(data, null, 2);
        });
}

function cargarTurnos() {
    fetch(API + "/turnos")
        .then(r => r.json())
        .then(data => {
            document.getElementById("turnos").textContent = JSON.stringify(data, null, 2);
        });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MediTurnos</title>
</head>

<body>
    <h1>🩺 Mediturnos — Frontend</h1>

    <h2>Listado de doctores</h2>
    <ul id="lista-doctores"></ul>

    <h2>Crear doctor</h2>
    <input id="nombre" placeholder="Nombre">
    <input id="especialidad" placeholder="Especialidad">
    <button onclick="crearDoctor()">Crear doctor</button>

    <h2>Crear turno</h2>
    <input id="turno-doctor-id" placeholder="ID Doctor">
    <input id="turno-nombre" placeholder="Nombre paciente">
    <input id="turno-email" placeholder="Email paciente">
    <button onclick="crearTurno()">Crear turno</button>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mediturnos</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: auto; padding: 20px; }
        input { margin: 5px 0; padding: 5px; width: 250px; }
        button { margin-top: 10px; padding: 6px 12px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Crear Doctor</h2>
    <input id="doc-nombre" placeholder="Nombre">
    <input id="doc-esp" placeholder="Especialidad">
    <button onclick="crearDoctor()">Crear Doctor</button>

    <h2>Crear Turno</h2>
    <input id="turno-docid" placeholder="ID Doctor">
    <input id="turno-pac" placeholder="Paciente">
    <input id="turno-fecha" placeholder="Fecha (YYYY/MM/DD)">
    <input id="turno-hora" placeholder="Hora (HH:MM)">
    <button onclick="crearTurno()">Crear Turno</button>

    <h2>Doctores</h2>
    <button onclick="verDoctores()">Ver Doctores</button>
    <pre id="lista-doctores"></pre>

    <h2>Turnos</h2>
    <button onclick="verTurnos()">Ver Turnos</button>
    <pre id="lista-turnos"></pre>

    <script src="app.js"></script>
</body>
</html>

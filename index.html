<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mediturnos — Frontend</title>
</head>
<body>
  <h1>Mediturnos — Frontend</h1>

  <h2>Listado de doctores</h2>
  <ul id="lista-doctores">
    <!-- acá se cargan los doctores -->
  </ul>

  <h2>Crear doctor</h2>
  <form id="form-doctor">
    <input id="doctor-nombre" type="text" placeholder="Nombre" required />
    <input id="doctor-especialidad" type="text" placeholder="Especialidad" required />
    <button type="submit">Crear doctor</button>
  </form>

  <h2>Crear turno</h2>
  <form id="form-turno">
    <input id="turno-doctor-id" type="number" placeholder="ID Doctor" required />
    <input id="turno-paciente-nombre" type="text" placeholder="Nombre paciente" required />
    <input id="turno-paciente-email" type="email" placeholder="Email paciente" required />
    <button type="submit">Crear turno</button>
  </form>

  <p id="mensaje" style="margin-top: 1rem; color: green;"></p>

  <!-- Cargamos el JS al final para que los elementos ya existan -->
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MediTurnos</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }
        h2 {
            margin-top: 40px;
        }
        input, select {
            padding: 8px;
            margin: 5px 0;
            width: 280px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }
        .box {
            padding: 15px;
            border: 1px solid #CCC;
            width: 350px;
            border-radius: 5px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<h1>MediTurnos - Panel de Pruebas</h1>

<div class="box">
    <h2>Crear Doctor</h2>
    <input id="doc_nombre" placeholder="Nombre del doctor">
    <input id="doc_especialidad" placeholder="Especialidad">
    <input id="doc_precio" type="number" placeholder="Precio consulta (ARS)">
    <button onclick="crearDoctor()">Crear Doctor</button>
</div>

<div class="box">
    <h2>Listar Doctores</h2>
    <button onclick="listarDoctores()">Cargar Doctores</button>
    <ul id="lista_doctores"></ul>
</div>

<div class="box">
    <h2>Crear Turno</h2>
    <select id="turno_doctor">
        <option value="">Seleccione un doctor</option>
    </select><br>
    <input id="paciente_nombre" placeholder="Nombre paciente">
    <input id="paciente_email" placeholder="Email paciente">
    <input id="fecha" type="date">
    <input id="hora" type="time">
    <button onclick="crearTurno()">Crear Turno</button>
</div>

<div class="box">
    <h2>Crear Preferencia Mercado Pago</h2>
    <button onclick="crearPreferencia()">Crear Preferencia</button>
    <p id="mp_result"></p>
</div>

<script src="app.js"></script>

</body>
</html>
